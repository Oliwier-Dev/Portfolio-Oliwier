<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <meta name="description" content="An earlier interactive flash-card quiz built by Oliwier Mako.">
    <meta name="author" content="Oliwier Makowski Trusz">
    <title>Flash Cards Quiz — Oliwier Mako</title>
    <link rel="canonical" href="https://oliwier-mako.vercel.app/other-pages/my-projects/project7-quiz/">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/shared/site.css">
    <script src="script.js" defer></script>
    <script src="/shared/site.js" defer></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <main class="app">
        <section id="startQuizContainer" class="screen active">
            <p class="screen-text">To start the quiz, tap the button below</p>
            <button id="startQuizBtn" type="button" onclick="startQuiz()" class="btn primary">Start</button>
        </section>

        <section id="quizContent" class="screen">
            <div class="card">

                <form id="form" novalidate>
                    <p id="questionText" class="question"></p>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="answer" value="A">
                            <span>Option One</span>
                        </label> <br>

                        <label class="option">
                            <input type="radio" name="answer" value="B">
                            <span>Option Two</span>
                        </label> <br>

                        <label class="option">
                            <input type="radio" name="answer" value="C">
                            <span>Option Three</span>
                        </label> <br>

                        <label class="option">
                            <input type="radio" name="answer" value="D">
                            <span>Option Four</span>
                        </label>
                    </div>
                </form>

            </div>
        </section>
        <section id="quizResultContainer" class="screen">
            <h2 id="resultText">Your score: 0 / 0</h2>
            <p id="resultSubtext"></p>

            <div class="actions">
                <button id="restartBtn" type="button" onclick="restartQuiz()" class="btn secondary">Restart</button>
            </div>
        </section>

    </main>
</body>
</html>
